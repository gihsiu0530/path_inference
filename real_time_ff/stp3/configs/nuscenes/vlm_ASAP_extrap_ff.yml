# Additive FF experiment with direct ego-motion extrapolation and no AD-MLP.
BASE_CONFIG: "stp3/configs/nuscenes/vlm.yml"

TAG: "Planning_ASAP_extrap_ff"

RESIDUAL_CONTEXT_DROP_EGO: False
FAST_DISABLE_RESIDUAL_GATE: False
LOSS_GATE_TARGET_W: 0.0
LOSS_RESIDUAL_AUX_W: 0.0
LOSS_EASY_RESIDUAL_REG_W: 0.0
LOSS_ENDPOINT_AUX_W: 0.0
LOSS_SMO_W: 0.1

# Constant SE(2) coarse extrapolation from recent ego-motion increments.
FF_EXTRAP_HISTORY_STEPS: 4
FF_EXTRAP_RECENCY_DECAY: 0.7
# NuscenesData stores inv(pose_t1) @ pose_t0; invert it before rolling forward.
FF_EXTRAP_INVERT_DATASET_EGOMOTION: True
FF_EXTRAP_MAX_SPEED_MPS: 12.0
FF_EXTRAP_MAX_YAW_RATE_DEG_S: 60.0

# Camera-to-BEV projection. Keep the training and inference depth convention equal.
FF_DEPTH_MODE: "relative_inverse"
FF_DEPTH_MIN_M: 1.0
FF_DEPTH_MAX_M: 60.0
FF_BEV_PROJECT_STRIDE: 2
FF_BEV_RESOLUTION_M: 0.5
FF_BEV_FORWARD_MIN_M: -10.0
FF_BEV_FORWARD_MAX_M: 50.0
FF_BEV_SIDE_MIN_M: -25.0
FF_BEV_SIDE_MAX_M: 25.0
FF_BEV_CHANNELS: 64
FF_BEV_PATCH_RADIUS_M: 1.0
FF_ROAD_SPLAT_RADIUS_M: 0.75

# Bounded coarse-normal residual and confidence.
FF_MAX_LATERAL_M: 2.0
FF_ALPHA_INIT: 0.10
FF_ALPHA_TARGET_DEADZONE_M: 0.15
FF_ALPHA_TARGET_TEMPERATURE_M: 0.08
FF_ROUTE_HEADS: 8

# Coarse perturbations remain important even with a deterministic extrapolator.
FF_COARSE_AUG_ENABLED: True
FF_COARSE_AUG_PROB: 0.75
FF_COARSE_AUG_LATERAL_M: 1.0
FF_COARSE_AUG_YAW_DEG: 5.0
FF_COARSE_AUG_SPEED_RATIO: 0.15
FF_COARSE_AUG_POINT_M: 0.20

# FF supervision and no-HD-map footprint safety.
LOSS_FF_LATERAL_W: 2.0
LOSS_FF_ALPHA_W: 0.25
LOSS_FF_IDENTITY_W: 0.5
LOSS_FF_OFFROAD_W: 8.0
LOSS_FF_IMPROVE_W: 4.0
LOSS_FF_ROUTE_W: 0.2
LOSS_FF_CORRIDOR_W: 2.0
FF_GT_CORRIDOR_RADIUS_M: 1.0
FF_UNKNOWN_POINT_COST: 0.15
FF_SAFETY_MIN_COVERAGE: 0.35
FF_UNKNOWN_RESIDUAL_PENALTY: 0.10
FF_SAFETY_MARGIN_M: 0.35
FF_SAFETY_FILTER_ENABLED: True
